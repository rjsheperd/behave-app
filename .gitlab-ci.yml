variables:
  GIT_SUBMODULE_STRATEGY: recursive

build-wasm:
  image: nixos/nix:latest
  stage: build
  cache:
    - key:
        files:
          - behave-lib/shell.nix
      paths:
        - /nix/store

    - key: cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - cache-$CI_DEFAULT_BRANCH
        - cache-default
      paths:
        - /nix/store
        - $PWD/.em_cache
  script:
    # Build WASM
    # - cd behave-lib
    # - nix-shell --run 'make install'
    # - cd ..

    # Commit back to the repo
    - git config user.email "ci-bot@sig-gis.com"
    - git config user.name "ci-bot"
    # - git add .
    # - git commit -m "Update WASM"
    # - git push origin HEAD -o ci.skip # prevent triggering pipeline again

build-desktop:
  image: nixos/nix:latest
  stage: build
  needs: ["build-wasm"]
  cache:
    - key:
        files:
          - projects/behave/shell.nix
      paths:
        - /nix/store
    - key: cache-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - cache-$CI_DEFAULT_BRANCH
        - cache-default
      paths:
        - /nix/store
  script:
    # Build Desktop App
    - echo $FIRELAB_AUTH_TOKEN
    - cd projects/behave
    - nix-shell --run 'bb build-desktop'

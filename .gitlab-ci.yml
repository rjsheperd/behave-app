stages:
  - build
  - deploy

build-cms:
  stage: build
  image: clojure:temurin-11-tools-deps-alpine
  script:
    ## Build the Behave CMS
    - cd projects/behave_cms
    - clojure -M:compile-cljs
    # - clojure -T:build org.corfield.build/uber :lib sig-gis/behave-cms :main behave-cms.server
    - clojure -X triangulum.packaging/build-uberjar :app-name behave-cms :main-ns behave-cms.server

  artifacts:
    paths:
      - "projects/behave_cms/target/*.jar"

build-app:
  stage: build
  image: temurin-11-tools-deps-alpine
  script:
    - cd projects/behave
    - clojure -M:compile-cljs
    - clojure -T:build org.corfield.build/uber :lib sig-gis/behave :main behave.core
  artifacts:
    paths:
      - "projects/behave/target/*.jar"


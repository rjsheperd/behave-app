stages:
  - build
  - deploy

build-cms:
  stage: build
  image: rjsheperd/clojure-bb-bun:latest
  script:
    - cd projects/behave_cms
    - bun install --production
    - bb build-js
    - bb uber

  artifacts:
    paths:
      - "projects/behave_cms/target/*.jar"

build-app:
  stage: build
  image: rjsheperd/clojure-bb-bun:latest
  script:
    - cd projects/behave
    - bun install --production
    - bb build-js
    - bb uber
  artifacts:
    paths:
      - "projects/behave/target/*.jar"


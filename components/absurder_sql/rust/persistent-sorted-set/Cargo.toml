[package]
name = "persistent-sorted-set"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
# Kept in sync with datascript-rs / absurder-sql (see that crate's note).
# Cargo.lock pins the exact set (wasm-bindgen 0.2.126, js-sys 0.3.103).
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lru = "0.12"
edn = "0.3"
regex-lite = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.30", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]

[dev-dependencies]
wasm-bindgen-test = "0.3"
tempfile = "3"

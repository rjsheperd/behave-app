[package]
name = "datascript-rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
persistent-sorted-set = { path = "../persistent-sorted-set" }
absurder-sql = { git = "https://github.com/npiesco/absurder-sql", tag = "v0.1.26", default-features = false, features = ["console_error_panic_hook", "console_log"] }
# Track absurder-sql's wasm ecosystem: v0.1.26 -> weblocks 0.2.0 needs
# js-sys >=0.3.99. Caret ranges accommodate compatible versions; Cargo.lock
# pins the exact set (currently wasm-bindgen 0.2.126, js-sys/web-sys 0.3.103).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
sqlite-wasm-rs = { version = "0.4", default-features = false, features = ["precompiled"] }
lru = "0.12"
serde = { version = "1.0", features = ["derive"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

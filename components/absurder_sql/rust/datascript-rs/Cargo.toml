[package]
name = "datascript-rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
persistent-sorted-set = { path = "../persistent-sorted-set" }
absurder-sql = { path = "../../reference/absurder-sql", default-features = false, features = ["console_error_panic_hook", "console_log"] }
# Pin to match absurder-sql's versions (weblocks 0.1.0 needs web-sys <=0.3.82 API)
wasm-bindgen = "=0.2.105"
js-sys = "=0.3.82"
web-sys = "=0.3.82"
sqlite-wasm-rs = { version = "0.4", default-features = false, features = ["precompiled"] }
lru = "0.12"
serde = { version = "1.0", features = ["derive"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

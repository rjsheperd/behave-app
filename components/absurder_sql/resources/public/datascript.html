<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataScript + SQLite (Rust Backend)</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: monospace; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
      h1 { margin-bottom: 0.5rem; }
      h1 + p { font-size: 0.8rem; color: #666; margin-bottom: 1rem; }
      h2 { margin: 1rem 0 0.5rem; font-size: 1rem; }
      #status { padding: 0.5rem; margin-bottom: 1rem; background: #eee; }
      textarea { width: 100%; font-family: monospace; font-size: 0.9rem; padding: 0.5rem; margin-bottom: 0.5rem; }
      #tx-input { height: 6rem; }
      #q-input { height: 4rem; }
      button { padding: 0.4rem 1rem; margin-right: 0.5rem; margin-bottom: 1rem; cursor: pointer; }
      #results { margin-top: 1rem; padding: 0.5rem; background: #f9f9f9; border: 1px solid #ccc; white-space: pre-wrap; word-break: break-all; min-height: 3rem; max-height: 16rem; overflow-y: auto; }
      #log { margin-top: 1rem; padding: 0.5rem; background: #1e1e1e; color: #0f0; font-size: 0.8rem; height: 12rem; overflow-y: auto; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>DataScript + SQLite</h1>
    <p>Rust backend: WasmDataScript for persistence, CLJS DataScript for transactions and queries.</p>
    <div id="status">Status: loading...</div>

    <h2>Transact</h2>
    <textarea id="tx-input">[{:db/id -1 :name "Maksim" :age 45 :email "max@example.com" :aka ["Max" "Stierlitz"]}
 {:db/id -2 :name "Anna" :age 31 :email "anna@example.com" :parent -1}
 {:db/id -3 :name "Ivan" :age 20 :parent -1}]</textarea>
    <div>
      <button id="btn-transact">Transact</button>
      <button id="btn-save">Save</button>
      <button id="btn-restore">Restore</button>
    </div>

    <h2>Query</h2>
    <textarea id="q-input">[:find ?n ?a :where [?e :name ?n] [?e :age ?a]]</textarea>
    <div>
      <button id="btn-query">Query</button>
      <button id="btn-datoms">Dump Datoms</button>
    </div>

    <h2>Entity</h2>
    <input id="entity-input" type="text" value="1" style="width:100%;font-family:monospace;font-size:0.9rem;padding:0.5rem;margin-bottom:0.5rem;" placeholder="Entity ID (number) or lookup ref [:email &quot;a@b.com&quot;]" />
    <div>
      <button id="btn-entity">Entity (touch)</button>
      <button id="btn-retract-entity">Retract Entity</button>
    </div>

    <h2>Multi-Source Query</h2>
    <p style="font-size:0.8rem;color:#666;margin-bottom:0.5rem;">
      Creates a second DB ($ws) with workspace data, then queries across both.
    </p>
    <textarea id="ws-tx-input" style="height:4rem;">[{:db/id -1 :name "Maksim" :role "admin"}
 {:db/id -2 :name "Ivan" :role "editor"}
 {:db/id -3 :name "Nikita" :role "viewer"}]</textarea>
    <textarea id="multi-q-input" style="height:4rem;">[:find ?n ?a ?role :in $ $ws :where [$ ?e :name ?n] [$ ?e :age ?a] [$ws ?w :name ?n] [$ws ?w :role ?role]]</textarea>
    <div>
      <button id="btn-multi-query">Multi-Source Query</button>
    </div>

    <h2>Import / Export</h2>
    <div>
      <button id="btn-export">Export .db</button>
      <button id="btn-import">Import .db</button>
      <button id="btn-gc">GC</button>
      <button id="btn-clear">Clear Log</button>
    </div>

    <div id="results"></div>
    <div id="log"></div>

    <!-- shadow-cljs compiled output -->
    <script src="/ds/main.js"></script>
  </body>
</html>
